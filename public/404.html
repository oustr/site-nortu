<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Nortu 自由语</title>
    <!--
      GitHub Pages 是纯静态托管：直接访问 /nortu/xxx（或在其上刷新）会落到这份 404.html，
      再由这里的脚本把地址改写成 /nortu/?/xxx 并跳回 index.html，由前端路由接住。

      pathSegmentsToKeep = 1 是关键：站点挂在项目页 /nortu/ 这一级子路径下，
      保留前 1 段（/nortu），后面的 xxx 原样带进 query。
      写成 0 会丢掉 /nortu 前缀，写成 2 会连带吃掉第一个子路径。
      query 里的 & 用 ~and~ 转义，避免和路径自带的查询串混在一起；
      还原逻辑见 index.html 里的同名脚本。
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search
            ? "&" + l.search.slice(1).replace(/&/g, "~and~")
            : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
