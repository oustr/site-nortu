<!doctype html>
<html lang="zh-CN" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <!--
      页面有最小宽度（1000px），手机视口比它窄，所以这里要把视口锁死在 1:1：
      布局视口取设备宽度，缩放恒为 1，超出的部分靠横向滚动看。
      不加 maximum-scale / user-scalable 的话，手机浏览器会自己把整页缩到
      屏宽（内容变小、vh 也跟着变大），跟桌面端把窗口拉窄的表现对不上；
      shrink-to-fit=no 是给老 iOS Safari 的同一件事。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no"
    />
    <title>Nortu 自由语</title>
    <!--
      favicon 用自由语标记：浅色模式用深色 logo（favicon-light.svg），
      深色模式用浅色 logo（favicon-dark.svg）。
      Safari 不支持 link 上的 media 属性，所以统一由下面的脚本按系统主题切换；
      href 先写成浅色模式那份，脚本没跑起来时也至少有个图标。
    -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <script>
      (function () {
        var link = document.getElementById("favicon");
        // 已经是 Vite 按 base 重写过的路径，替换文件名即可保持前缀一致
        var lightHref = link.getAttribute("href");
        var darkHref = lightHref.replace("favicon-light", "favicon-dark");
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          link.href = mq.matches ? darkHref : lightHref;
        }
        apply();
        if (mq.addEventListener) mq.addEventListener("change", apply);
        else mq.addListener(apply);
      })();
    </script>
    <!--
      与 public/404.html 配对：那边把 /nortu/xxx 重定向成 /nortu/?/xxx，
      这里在 React 挂载前把地址还原成 /nortu/xxx，路由才能按正常路径匹配。
      replaceState 不留历史记录，用户按返回不会又弹回 ?/ 形式。
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/index.tsx"></script>
  </body>
</html>
